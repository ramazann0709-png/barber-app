<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Запись в барбершоп</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #d4af37;
      --text: #ffffff;
      --text-muted: #888888;
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin: 16px 0 10px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .card.selected {
      border-color: var(--accent);
      background: #25221b;
    }
    .card-title {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .card-price {
      color: var(--accent);
      font-weight: bold;
    }
    .masters-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .master-card {
      background: var(--card-bg);
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
    }
    .master-card.selected {
      border-color: var(--accent);
      background: #25221b;
    }
    .time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .time-slot {
      background: var(--card-bg);
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 0;
      text-align: center;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .time-slot.selected {
      border-color: var(--accent);
      background: var(--accent);
      color: #000;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>1. Выберите услугу</h2>
  <div class="grid" id="services-list">
    <div class="card selected" onclick="selectService(this, 'Мужская стрижка', 1200)">
      <span class="card-title">Мужская стрижка</span>
      <span class="card-price">1200 ₽</span>
    </div>
    <div class="card" onclick="selectService(this, 'Моделирование бороды', 700)">
      <span class="card-title">Моделирование бороды</span>
      <span class="card-price">700 ₽</span>
    </div>
    <div class="card" onclick="selectService(this, 'Комплекс (Стрижка + Борода)', 1700)">
      <span class="card-title">Комплекс (Стрижка + Борода)</span>
      <span class="card-price">1700 ₽</span>
    </div>
  </div>

  <h2>2. Выберите мастера</h2>
  <div class="masters-grid" id="masters-list">
    <div class="master-card selected" onclick="selectMaster(this, 'Магомед')">
      <div style="font-size: 1.5rem; margin-bottom: 4px;">✂️</div>
      <div style="font-size: 0.85rem; font-weight: 600;">Магомед</div>
    </div>
    <div class="master-card" onclick="selectMaster(this, 'Али')">
      <div style="font-size: 1.5rem; margin-bottom: 4px;">✂️</div>
      <div style="font-size: 0.85rem; font-weight: 600;">Али</div>
    </div>
    <div class="master-card" onclick="selectMaster(this, 'Мурад')">
      <div style="font-size: 1.5rem; margin-bottom: 4px;">✂️</div>
      <div style="font-size: 0.85rem; font-weight: 600;">Мурад</div>
    </div>
  </div>

  <h2>3. Время на сегодня</h2>
  <div class="time-grid" id="time-list">
    <div class="time-slot selected" onclick="selectTime(this, '12:00')">12:00</div>
    <div class="time-slot" onclick="selectTime(this, '14:00')">14:00</div>
    <div class="time-slot" onclick="selectTime(this, '16:00')">16:00</div>
    <div class="time-slot" onclick="selectTime(this, '18:00')">18:00</div>
    <div class="time-slot" onclick="selectTime(this, '19:30')">19:30</div>
    <div class="time-slot" onclick="selectTime(this, '20:30')">20:30</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем окно на весь экран

    let booking = {
      service: "Мужская стрижка",
      price: 1200,
      master: "Магомед",
      time: "12:00"
    };

    function updateMainButton() {
      tg.MainButton.setText(`ЗАПИСАТЬСЯ НА ${booking.time} (${booking.price} ₽)`);
      tg.MainButton.show();
    }

    function selectService(el, name, price) {
      document.querySelectorAll('#services-list .card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      booking.service = name;
      booking.price = price;
      updateMainButton();
    }

    function selectMaster(el, name) {
      document.querySelectorAll('#masters-list .master-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      booking.master = name;
      updateMainButton();
    }

    function selectTime(el, time) {
      document.querySelectorAll('#time-list .time-slot').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      booking.time = time;
      updateMainButton();
    }

    // При клике на нижнюю главную кнопку Telegram
    Telegram.WebApp.onEvent('mainButtonClicked', function(){
      tg.sendData(JSON.stringify(booking)); // Отправляем данные обратно боту
    });

    updateMainButton();
  </script>
</body>
</html>
